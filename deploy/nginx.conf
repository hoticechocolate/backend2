server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    location /admin/ {
        proxy_pass http://admin:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /compat/rest/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
    }

    location /compat/storage/v1/object/public/sic-images/ {
        rewrite ^/compat(.*)$ https://kinjeyanbgxxeinswbpm.supabase.co$1 redirect;
    }

    location = /health { proxy_pass http://web:8000; }
    location = /docs { proxy_pass http://web:8000; }
    location = /openapi.json { proxy_pass http://web:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
